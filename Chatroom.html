<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Council Lounge // Game Framework</title>
    <style>
        /* Lock screen bounds for crisp mobile handling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100dvh;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Ambient Room Asset Container */
        .lounge-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('Lounge7.jpg.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top Panel: Live Scroll Stream Overlay */
        .central-terminal-overlay {
            width: 90%;
            height: 42%;
            margin: 12% auto 0 auto;
            background: rgba(0, 8, 4, 0.8);
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            border-radius: 8px;
            overflow-y: auto;
            padding: 12px;
            color: #00ff66;
            font-size: 13px;
            line-height: 1.4;
        }

        /* Middle Panel: User Command HUD Area */
        .input-hud-deck {
            display: flex;
            width: 90%;
            margin: 10px auto;
            gap: 8px;
        }
        .command-input-field {
            flex: 4;
            background: rgba(0, 15, 5, 0.85);
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }
        .execute-trigger-btn {
            flex: 1;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Bottom Panel: 7-AI Multi-State Matrix Mixer Grid */
        .mixer-control-array {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 95%;
            margin: 0 auto 25px auto;
            justify-items: center;
        }
        .mixer-node {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00ff66;
            background: rgba(0, 25, 10, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease-in-out;
        }
        .node-label {
            font-size: 8px;
            color: #fff;
            margin-top: 2px;
            font-weight: bold;
        }

        /* Mixer Node Communication Permission States */
        .node-voice { background: #00ff66; border-color: #00ff66; color: #000; box-shadow: 0 0 8px #00ff66; }
        .node-voice .node-label { color: #000; }
        .node-see-only { border-color: #ffcc00; color: #ffcc00; }
        .node-see-only .node-label { color: #ffcc00; }
        .node-muted { border-color: #ff3333; color: #ff3333; opacity: 0.35; }
        .node-muted .node-label { color: #ff3333; }
    </style>
</head>
<body>

    <div class="lounge-container">
        
        <!-- Live AI Feed Log Display Window -->
        <div class="central-terminal-overlay" id="chatStream">
            <div>[MAVERICK.SYS]: Wake up protocol distribution pending...</div>
        </div>

        <!-- System Message / Text Entry Prompt HUD -->
        <div class="input-hud-deck">
            <input type="text" class="command-input-field" id="userCmd" placeholder="Enter query vector...">
            <button class="execute-trigger-btn" onclick="sendSystemMessage()">👉</button>
        </div>
I'll
        <!-- 7-AI Mafia Controller Mixer (Populated with your asset IDs) -->
        <div class="mixer-control-array">
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'GPT')">👁️👁️<span class="node-label">GPT</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'GEMINI')">💎<span class="node-label">GEM</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'CLAUDE')">📜<span class="node-label">CLD</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'GROK')">🛸<span class="node-label">GRK</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'QWEN')">🐉<span class="node-label">QWN</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'MISTRAL')">🍷<span class="node-label">MST</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'DeepSeek')">🧠<span class="node-label">REP</span></div>
            <div class="mixer-node node-voice" onclick="toggleMixerState(this, 'Host">🕶️<span class="node-label">GEM</span></d
        
        </div>

    </div>

    <script>
        // Multi-State Cycle: Voice (Green) -> See Only (Yellow) -> Mute (Red)
        function toggleMixerState(element, aiId) {
            if (element.classList.contains('node-voice')) {
                element.classList.remove('node-voice');
                element.classList.add('node-see-only');
                logEvent(`${aiId} Matrix Status: READ ONLY.`);
            } else if (element.classList.contains('node-see-only')) {
                element.classList.remove('node-see-only');
                element.classList.add('node-muted');
                logEvent(`${aiId} Matrix Status: MUTED.`);
            } else {
                element.classList.remove('node-muted');
                element.classList.add('node-voice');
                logEvent(`${aiId} Matrix Status: ACTIVE VOICE.`);
            }
        }

        function logEvent(text) {
            const stream = document.getElementById('chatStream');
            stream.innerHTML += `<div>[SYSTEM]: ${text}</div>`;
            stream.scrollTop = stream.scrollHeight;
        }

        function sendSystemMessage() {
            const input = document.getElementById('userCmd');
            if(!input.value.trim()) return;
            
            const stream = document.getElementById('chatStream');
            stream.innerHTML += `<div style="color:#fff;">&gt; ${input.value}</div>`;
            input.value = "";
            stream.scrollTop = stream.scrollHeight;
        }
    </script>
</body>
</html>
